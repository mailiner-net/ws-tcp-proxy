name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip image build; redeploy the current :latest tag"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".env.scaleway.example"

concurrency:
  group: deploy-scaleway
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION || 'fr-par' }}
  SCALEWAY_REGISTRY_NS: ${{ vars.SCALEWAY_REGISTRY_NS || 'mailiner-ws-tcp-proxy' }}
  SCALEWAY_CONTAINER_NS: ${{ vars.SCALEWAY_CONTAINER_NS || 'mailiner-dev' }}
  SCALEWAY_CONTAINER_NAME: ${{ vars.SCALEWAY_CONTAINER_NAME || 'ws-tcp-proxy' }}
  SCALEWAY_IMAGE_NAME: ws-tcp-proxy

jobs:
  deploy:
    name: Build & deploy to Scaleway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=rg.${SCW_DEFAULT_REGION}.scw.cloud/${SCALEWAY_REGISTRY_NS}" >> "$GITHUB_OUTPUT"

      - name: Install Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Ensure Container Registry namespace
        if: ${{ inputs.skip_build != true }}
        run: ./scripts/deploy-scaleway.sh --registry-only

      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.skip_build != true }}

      - uses: docker/login-action@v3
        if: ${{ inputs.skip_build != true }}
        with:
          registry: rg.${{ env.SCW_DEFAULT_REGION }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - uses: docker/build-push-action@v6
        if: ${{ inputs.skip_build != true }}
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/${{ env.SCALEWAY_IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.registry }}/${{ env.SCALEWAY_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Serverless Container
        id: deploy
        env:
          MAILINER_PASETO_SECRET: ${{ secrets.MAILINER_PASETO_SECRET }}
          METRICS_AUTH_TOKEN: ${{ secrets.METRICS_AUTH_TOKEN }}
          MAILINER_AUTH: ${{ vars.MAILINER_AUTH || 'paseto' }}
          MAILINER_ALLOWED_ORIGINS: ${{ vars.MAILINER_ALLOWED_ORIGINS }}
          MAILINER_ALLOWED_HOSTS: ${{ vars.MAILINER_ALLOWED_HOSTS }}
          SCALEWAY_IMAGE_TAG: ${{ inputs.skip_build && 'latest' || steps.meta.outputs.sha }}
        run: ./scripts/deploy-scaleway.sh --skip-build

      - name: Verify /health
        run: |
          endpoint="${{ steps.deploy.outputs.endpoint }}"
          if [[ -z "$endpoint" ]]; then
            echo "deploy step did not report an endpoint" >&2
            exit 1
          fi
          curl -fsS --retry 20 --retry-all-errors --retry-delay 3 --max-time 20 \
            "${endpoint}/health"
