name: Build & Deploy

on:
    workflow_dispatch:

jobs:
    build:
        name: Build & Deploy
        runs-on: ubuntu-latest
        permissions:
            contents: 'read'
            id-token: 'write'

        steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Get revision
          id: vars
          run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"
        - name: Google Auth
          id: auth
          uses: 'google-github-actions/auth@v2'
          with:
            token_format: 'access_token'
            workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
            service_account: '${{ secrets.SERVICE_ACCOUNT_EMAIL }}'
        - name: Docker Auth
          id: docker-auth
          uses: 'docker/login-action@v3'
          with:
            username: 'oauth2accesstoken'
            password: '${{ steps.auth.outputs.access_token }}'
            registry: '${{ vars.GCP_REGION }}-docker.pkg.dev'

        - name: Build, tag and push container
          id: build-image
          uses: docker/build-push-action@v6
          with:
            context: ${{ vars.code_directory }}
            push: true
            tags:
                ${{ vars.GCP_REGION }}-docker.pkg.dev/mailiner/mailiner/ws-tcp-proxy:${{ steps.vars.outputs.sha_short}}

        - name: Deploy to Cloud Run
          id: deploy
          uses: google-github-actions/deploy-cloudrun@v2
          with:
            project_id: ${{ vars.GCP_PROJECT_ID }}
            service: ${{ vars.GCP_SERVICE_NAME }}
            region: ${{ vars.GCP_REGION }}
            secrets: |
                MAILINER_PASETO_SECRET=MAILINER_PASETO_SECRET:latest
            env_vars: |
                LOG_LEVEL=debug
            image: ${{ vars.GCP_REGION }}-docker.pkg.dev/mailiner/mailiner/ws-tcp-proxy:${{ steps.vars.outputs.sha_short}}
