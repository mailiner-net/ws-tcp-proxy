name: Build & Deploy

on:
    workflow_dispatch:

jobs:
    build:
        name: Build & Deploy
        runs-on: ubuntu-latest
        permissions:
            contents: 'read'
            packages: 'write'

        steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Get revision
          id: vars
          run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"
        - name: Docker Auth
          id: docker-auth
          uses: 'docker/login-action@v3'
          with:
            registry: 'ghcr.io'
            username: '${{ github.actor }}'
            password: '${{ secrets.GITHUB_TOKEN }}'

        - name: Build, tag and push container
          id: build-image
          uses: docker/build-push-action@v6
          with:
            context: ${{ vars.code_directory }}
            push: true
            tags:
                ghcr.io/mailiner-net/ws-tcp-proxy:${{ steps.vars.outputs.sha_short}}

