[package]
name = "ws-tcp-proxy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.7.5", features = [ "http1", "http2", "macros", "original-uri", "tokio", "ws", "query", "tracing", "tower-log" ] }
chrono = "0.4.38"
clap = { version = "4.5.4", features = [ "derive", "env" ] }
env_logger = "0.11.3"
futures-util = "0.3.30"
lazy_static = "1.4.0"
once_cell = "1.19.0"
prometheus-client = "0.22.2"
rusty_paseto = "0.7.1"
serde = "1.0.203"
sha2 = "0.10.8"
slog = "2.7.0"
slog-async = "2.8.0"
slog-term = "2.9.1"
tokio = { version = "1.38.0", features = [ "macros", "rt-multi-thread" ] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[dev-dependencies]
bytes = "1.6.0"
tokio-websockets = { version = "0.8.3", features = ["fastrand", "sha1_smol", "client"] }
