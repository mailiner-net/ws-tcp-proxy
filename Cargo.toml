[package]
name = "ws-tcp-proxy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = [ "http1", "http2", "macros", "original-uri", "tokio", "ws", "query", "tracing", "tower-log" ] }
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = [ "derive", "env" ] }
env_logger = "0.11.11"
futures-util = "0.3.34"
lazy_static = "1.5.0"
once_cell = "1.21.4"
prometheus-client = "0.25.0"
rusty_paseto = "0.10.0"
serde = "1.0.229"
sha2 = "0.11.0"
slog = "2.8.2"
slog-async = "2.8.0"
slog-term = "2.9.2"
tokio = { version = "1.53.1", features = [ "macros", "rt-multi-thread", "signal" ] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tokio-websockets = { version = "0.13.3", features = ["fastrand", "sha1_smol", "client"] }
