[package]
name = "ws-tcp-proxy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.7.5", features = [ "http1", "http2", "macros", "original-uri", "tokio", "ws", "query", "tracing", "tower-log" ] }
env_logger = "0.11.3"
futures-util = "0.3.30"
jwt = "0.16.0"
lazy_static = "1.4.0"
prometheus-client = "0.22.2"
serde = "1.0.203"
slog = "2.7.0"
slog-async = "2.8.0"
slog-term = "2.9.1"
tokio = { version = "1.38.0", features = [ "macros", "rt-multi-thread" ] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
